<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f0f4ff">
  <title>Registro de Ponto</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ponto">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">

  <style>
  /* ── Design tokens ── */
  :root {
    --bg:       #f0f4ff;
    --surf:     #ffffff;
    --surf2:    #e8edf8;
    --border:   #c5d3eb;
    --accent:   #1d6fe8;
    --accent2:  #3b82f6;
    --text1:    #0f172a;
    --text2:    #4a6484;
    --text3:    #8fa8c8;
    --pos:      #059669;
    --neg:      #dc2626;
    --warn:     #b45309;
    --r:        12px;
    --mono:     'JetBrains Mono', monospace;
    --sans:     'Inter', system-ui, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text1);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
    padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
    padding-block: calc(28px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-bottom));
  }

  .wrap {
    max-width: 500px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Header */
  .hd {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .hd-title {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text2);
  }

  .hd-date {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--text3);
    font-variant-numeric: tabular-nums;
  }

  /* Punch card */
  .punch-card {
    background: var(--surf);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 26px 22px 20px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 16px;
  }

  .punch-status { text-align: center; }

  .punch-main {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text1);
    line-height: 1.35;
  }

  .punch-sub {
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text2);
    line-height: 1.7;
  }

  .punch-sub div { font-variant-numeric: tabular-nums; }

  .punch-main.warn { color: var(--warn); }

  .radio-group { display: flex; gap: 10px; }

  .radio-opt {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 10px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--surf2);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text2);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
  }

  .radio-opt input { accent-color: var(--accent); width: 17px; height: 17px; }

  .radio-opt.selected {
    border-color: var(--accent);
    background: rgba(29, 111, 232, 0.08);
    color: var(--text1);
  }

  .controls { display: flex; gap: 10px; width: 100%; }

  .btn {
    font-family: var(--sans);
    font-size: 0.875rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 13px 22px;
    min-height: 44px;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
    line-height: 1;
  }

  .btn-primary { background: var(--accent); color: #fff; flex: 1; min-width: 112px; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .btn-ghost {
    background: var(--surf2);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text1); }
  .btn-ghost:disabled { opacity: 0.3; cursor: not-allowed; }

  .msg {
    font-size: 0.78rem;
    text-align: center;
    padding: 9px 10px;
    border-radius: 8px;
    background: var(--surf2);
    color: var(--text2);
  }
  .msg.ok  { background: rgba(5, 150, 105, 0.1);  color: var(--pos); }
  .msg.err { background: rgba(220, 38, 38, 0.1);  color: var(--neg); }
  .msg.warn{ background: rgba(180, 83, 9, 0.1);   color: var(--warn); }

  .refresh-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .link-btn {
    all: unset;
    cursor: pointer;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text2);
    font-family: var(--sans);
    background: var(--surf2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 16px;
    min-height: 40px;
    display: inline-flex;
    align-items: center;
  }
  .link-btn:hover { color: var(--text1); border-color: var(--accent); }
  .link-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .refresh-info {
    font-size: 0.66rem;
    color: var(--text3);
    font-family: var(--mono);
  }

  /* Stats grid */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .stat {
    background: var(--surf);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 14px 16px;
  }

  .stat-lbl {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text3);
    font-weight: 500;
    margin-bottom: 6px;
  }

  .stat-val {
    font-family: var(--mono);
    font-size: 1.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--text1);
  }

  .stat-val.pos { color: var(--pos); }
  .stat-val.neg { color: var(--neg); }

  .stat-sub {
    font-size: 0.65rem;
    color: var(--text3);
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
  }

  /* History */
  .sec-hd {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text3);
    font-weight: 600;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .hist-empty {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--text3);
    padding: 14px 0;
  }

  .hist-table {
    width: 100%;
    border-collapse: collapse;
  }

  .hist-table th {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text3);
    font-weight: 600;
    text-align: left;
    padding: 0 0 8px;
  }

  .hist-table th:not(:first-child) { text-align: right; }

  .hist-table td {
    font-family: var(--mono);
    font-size: 0.78rem;
    font-variant-numeric: tabular-nums;
    padding: 7px 0;
    border-top: 1px solid var(--border);
    color: var(--text2);
    vertical-align: middle;
  }

  .hist-table td:first-child {
    font-family: var(--sans);
    font-size: 0.78rem;
    color: var(--text2);
  }

  .hist-table td:not(:first-child) { text-align: right; }

  .d-pos { color: var(--pos); }
  .d-neg { color: var(--neg); }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 2px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    all: unset;
    cursor: pointer;
    flex: 0 0 auto;
    padding: 11px 14px;
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--text3);
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    min-height: 44px;
    display: flex;
    align-items: center;
  }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Views */
  .view {
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  .view.active { display: flex; }

  .view-panel {
    background: var(--surf);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .field { display: flex; flex-direction: column; gap: 5px; }

  .field label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text3);
    font-weight: 600;
  }

  .field input {
    background: var(--surf2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 11px;
    font-family: var(--mono);
    font-size: 16px;
    color: var(--text1);
    outline: none;
    transition: border-color 0.15s;
    width: 100%;
  }

  .field input:focus { border-color: var(--accent); }

  .sync-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .sync-status {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--text3);
    flex: 1;
  }

  .sync-status.ok  { color: var(--pos); }
  .sync-status.err { color: var(--neg); }

  /* Report */
  .report-subhd {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text3);
    font-weight: 600;
    margin: 14px 0 6px;
  }

  .stats-sm {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }

  .stat-sm { padding: 10px 12px; }

  .stat-val-sm {
    font-family: var(--mono);
    font-size: 0.95rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    color: var(--text1);
  }

  .badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
  }

  .badge {
    flex: 1 1 auto;
    min-width: 120px;
    background: var(--surf2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
  }

  .badge-lbl {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text3);
    font-weight: 600;
    margin-bottom: 3px;
  }

  .badge-val {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text2);
    font-variant-numeric: tabular-nums;
  }

  .flags {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .flag-chip {
    font-size: 0.68rem;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(220, 38, 38, 0.1);
    color: var(--neg);
    cursor: default;
  }

  .weekbars {
    display: flex;
    justify-content: space-between;
    gap: 5px;
    margin-top: 6px;
  }

  .weekbar {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .weekbar-track {
    width: 100%;
    max-width: 22px;
    height: 44px;
    display: flex;
    flex-direction: column;
  }

  .weekbar-top {
    flex: 1;
    display: flex;
    align-items: flex-end;
    border-bottom: 1px solid var(--border);
  }

  .weekbar-bottom {
    flex: 1;
    display: flex;
    align-items: flex-start;
  }

  .weekbar-bar {
    width: 100%;
    border-radius: 2px;
    min-height: 2px;
  }

  .weekbar-bar.pos { background: var(--pos); }
  .weekbar-bar.neg { background: var(--neg); }

  .weekbar-lbl {
    font-size: 0.62rem;
    color: var(--text3);
    font-weight: 500;
  }

  /* Heatmap */
  .hm-summary {
    display: flex;
    gap: 16px;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--text2);
  }
  .hm-summary b { color: var(--text1); }

  .hm-dow {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-top: 4px;
  }
  .hm-dow span {
    text-align: center;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text3);
    font-weight: 600;
  }

  .hm-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .hm-cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surf2);
    font-family: var(--mono);
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
    color: var(--text2);
    cursor: default;
  }
  .hm-cell.hm-empty { background: transparent; border-color: transparent; }
  .hm-cell.hm-light { color: #fff; }
  .hm-cell.hm-incomplete { box-shadow: inset 0 0 0 2px var(--warn); }

  .hm-legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.68rem;
    color: var(--text2);
  }

  .hm-swatch {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    margin-right: 5px;
    vertical-align: middle;
  }

  /* Editor (correção manual) */
  .editor-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 0;
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    flex-wrap: wrap;
  }
  .editor-row:first-child { border-top: none; }

  .editor-row-label {
    flex: 0 0 56px;
    font-weight: 600;
    color: var(--text2);
  }

  .editor-tag {
    font-size: 0.6rem;
    color: var(--text3);
    flex-basis: 100%;
  }

  .editor-row input[type="time"],
  .editor-row select,
  .editor-add-row input[type="time"],
  .editor-add-row select {
    background: var(--surf2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 8px;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text1);
  }

  .editor-row-actions {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }

  .icon-btn {
    all: unset;
    cursor: pointer;
    font-size: 1rem;
    padding: 4px 6px;
    line-height: 1;
  }

  .editor-add-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  </style>
</head>
<body>

  <div class="wrap">

    <!-- Header -->
    <header class="hd">
      <span class="hd-title">Registro de Ponto</span>
      <span class="hd-date" id="dateBadge"></span>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-view="home" onclick="switchView('home')">Início</button>
      <button class="tab" data-view="report" onclick="switchView('report')">Relatório</button>
      <button class="tab" data-view="heatmap" onclick="switchView('heatmap')">Calendário</button>
      <button class="tab" data-view="editor" onclick="switchView('editor')">Corrigir</button>
      <button class="tab" data-view="settings" onclick="switchView('settings')">Ajustes</button>
    </nav>

    <!-- Home -->
    <div class="view active" id="viewHome">

      <!-- Punch card -->
      <div class="punch-card">
        <div class="punch-status">
          <div class="punch-main" id="punchMain">Carregando…</div>
          <div class="punch-sub" id="punchSub"></div>
        </div>

        <div class="radio-group" id="radioGroup" hidden>
          <label class="radio-opt" id="optEntrada">
            <input type="radio" name="tipo" value="entrada" onchange="onTipoChange('entrada')">
            Entrada
          </label>
          <label class="radio-opt" id="optSaida">
            <input type="radio" name="tipo" value="saida" onchange="onTipoChange('saida')">
            Saída
          </label>
        </div>

        <div class="controls">
          <button class="btn btn-primary" id="btnPunch" onclick="onPunchClick()">Registrar Ponto</button>
          <button class="btn btn-ghost" id="btnCancel" onclick="onCancelClick()" hidden>Cancelar</button>
        </div>

        <div class="msg" id="msgBox" hidden></div>

        <div class="refresh-row">
          <button class="link-btn" id="btnRefresh" onclick="onRefreshClick()">↻ Atualizar</button>
          <span class="refresh-info" id="refreshInfo"></span>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats">
        <div class="stat">
          <div class="stat-lbl">Hoje</div>
          <div class="stat-val" id="sToday">0h 00m</div>
          <div class="stat-sub" id="sMeta">Meta: 8h 00m</div>
        </div>
        <div class="stat">
          <div class="stat-lbl">Banco de horas</div>
          <div class="stat-val" id="sBank">—</div>
          <div class="stat-sub" id="sBankSub">dias fechados</div>
        </div>
        <div class="stat">
          <div class="stat-lbl">Semana</div>
          <div class="stat-val" id="sWeek">0h 00m</div>
          <div class="stat-sub" id="sWeekSub">0 dias</div>
        </div>
        <div class="stat">
          <div class="stat-lbl">Média diária</div>
          <div class="stat-val" id="sAvg">0h 00m</div>
          <div class="stat-sub">últimos 7 dias</div>
        </div>
      </div>

      <!-- History -->
      <div>
        <div class="sec-hd">Histórico</div>
        <div id="histWrap"></div>
      </div>

    </div>

    <!-- Report -->
    <div class="view" id="viewReport">
      <div class="view-panel">
        <div class="field">
          <label>Mês</label>
          <input type="month" id="reportMonthInput" onchange="onReportMonthChange()">
        </div>
        <div id="reportBody"></div>
      </div>
    </div>

    <!-- Heatmap -->
    <div class="view" id="viewHeatmap">
      <div class="view-panel">
        <div class="field">
          <label>Mês</label>
          <input type="month" id="heatmapMonthInput" onchange="onHeatmapMonthChange()">
        </div>
        <div id="heatmapBody"></div>
      </div>
    </div>

    <!-- Editor (correção manual) -->
    <div class="view" id="viewEditor">
      <div class="view-panel">
        <div class="field">
          <label>Dia</label>
          <input type="date" id="editorDateInput" onchange="onEditorDateChange()">
        </div>
        <div id="editorList"></div>
        <div class="editor-add-row">
          <input type="time" id="editorNewTime" value="08:00">
          <select id="editorNewTipo">
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
          </select>
          <button class="btn btn-ghost" id="btnEditorAdd" onclick="onEditorAdd()" style="padding: 8px 14px; font-size:0.8rem;">+ Adicionar batida</button>
        </div>
        <div class="msg" id="editorMsg" hidden></div>
      </div>
    </div>

    <!-- Settings -->
    <div class="view" id="viewSettings">
      <div class="view-panel">
        <div class="field">
          <label>Meta diária (horas)</label>
          <input type="number" id="goalInput" min="0.5" max="24" step="0.5"
                value="8" onchange="onGoalChange()">
        </div>
        <div class="field">
          <label>Saldo legado (banco de horas de antes do app)</label>
          <div class="sync-row">
            <input type="number" id="legacyInput" step="0.25" placeholder="ex: 12.5 ou -3" style="flex:1;">
            <button class="btn btn-ghost" onclick="onLegacySave()" style="padding: 7px 14px; font-size:0.8rem;">Salvar</button>
          </div>
          <span class="sync-status" id="legacyStatus"></span>
        </div>
        <div class="field">
          <label>URL do Google Apps Script</label>
          <input type="url" id="urlInput" placeholder="https://script.google.com/macros/s/…/exec"
                oninput="onUrlChange()">
        </div>
        <div class="sync-row">
          <button class="btn btn-ghost" onclick="onManualSync()" style="padding: 7px 14px; font-size:0.8rem;">
            Atualizar agora
          </button>
          <span class="sync-status" id="syncStatus">sem URL configurada</span>
        </div>
        <div class="field">
          <label>Lembrar de iniciar às</label>
          <input type="time" id="reminderTimeInput" value="09:15" onchange="onReminderTimeChange()">
        </div>
        <div class="sync-row">
          <button class="btn btn-ghost" id="btnNotify" onclick="toggleNotifications()" style="padding: 7px 14px; font-size:0.8rem;">
            Ativar notificações
          </button>

  // ── Store ──────────────────────────────────────────────
  // Modelo novo: a fonte da verdade é a planilha (uma linha por batida:

  // sempre recalculado a partir de now() - horário do último registro.
  // Isso elimina o bug de perder o rastreio quando o iOS mata a aba.
  const STORE_KEY = 'rp_v2';

  // Preenchido após publicar o Worker (ver seção "Setup do Cloudflare Worker" no README)
  const VAPID_PUBLIC_KEY = 'BDzLdoQ-sSlYrtgMsLFqCQt0fdlpH021ACMLciZZRBkMx4nhhJLcVJmFxb2mT47X5KbFCgl6gwWar7Rga5mVx3E';
  const WORKER_URL       = 'https://time-tracker-push.np-gabriel.workers.dev';
  const PUSH_AUTH_TOKEN  = '99e38234cabe8fbebc1af93213ad16c503c16bbda9d387cd'; // só evita spam no KV, não é segurança real

  let db = {       // persisted (localStorage)

  // ── Date helpers (sempre horário local — evita virar o dia perto da meia-noite em UTC) ──
  function localIsoDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function isoToday() { return localIsoDate(new Date()); }

  function combineDateTime(dateStr, timeStr) {
    const [y, mo, d] = dateStr.split('-').map(Number);
    const [h, mi] = timeStr.split(':').map(Number);
    return new Date(y, mo - 1, d, h, mi, 0, 0);
  }

  function weekDates() {
    const now = new Date();
    const dow = now.getDay();                       // 0=Sun
    const mon = new Date(now);
    mon.setDate(now.getDate() - (dow === 0 ? 6 : dow - 1));
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(mon);
      d.setDate(mon.getDate() + i);
      return localIsoDate(d);
    });
  }

  function last7() {
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date();
      d.setDate(d.getDate() - (6 - i));
      return localIsoDate(d);
    });
  }

  // ── Format ────────────────────────────────────────────
  function fmtHm(ms) {
    const sign = ms < 0 ? '-' : '';
    const abs  = Math.abs(ms);
    const h    = Math.floor(abs / 3600000);
    const m    = Math.floor((abs % 3600000) / 60000);
    return `${sign}${h}h ${pad(m)}m`;
  }

  function fmtTime(date) {
    return `${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function fmtDate(iso) {
    const [y, mo, d] = iso.split('-');
    const date = new Date(+y, +mo - 1, +d);
    const days = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    return `${days[date.getDay()]} ${d}/${mo}`;
  }

  // ── Status: deriva o estado atual a partir das batidas ─────────────
  // Regras:
  //  - último registro = "entrada"      → trabalhando agora (mesmo que tenha
  //    cruzado a meia-noite — turnos de madrugada não geram mais alerta;
  //    a saída, quando batida, será atribuída ao dia dessa entrada)
  //  - último = "saída" no mesmo dia    → intervalo/almoço em andamento
  //  - último = "saída" em dia anterior → interjornada (descanso entre dias)
  function pairSums(dayRecordsSorted) {
    let ms = 0;
    let open = null;
    for (const r of dayRecordsSorted) {
      if (r.tipo === 'entrada') {
        open = r;
      } else if (r.tipo === 'saida' && open) {
        ms += new Date(r.horario).getTime() - new Date(open.horario).getTime();
        open = null;
      }
    }
    return { ms, open };
  }

  function computeStatus(records) {
    const sorted = [...records].sort((a, b) => new Date(a.horario) - new Date(b.horario));
    const today = isoToday();
    const todayRecords = sorted.filter(r => r.competencia === today);
    const last = sorted[sorted.length - 1] || null;
    const workedTodayMs = pairSums(todayRecords).ms; // só pares já fechados hoje
    const now = Date.now();

    if (!last) {
      return { kind: 'empty', defaultTipo: 'entrada', workedTodayMs: 0, todayRecords };
    }

    if (last.tipo === 'entrada') {
      // Sessão em aberto. Se a entrada já pertence a hoje, soma ao total do
      // dia; se veio de um dia anterior (madrugada), "hoje" fica em 0 até a
      // saída ser batida (ela será contabilizada no dia da entrada).
      const elapsedMs = now - new Date(last.horario).getTime();
      const sessionBelongsToday = last.competencia === today;
      const liveTotalMs = workedTodayMs + (sessionBelongsToday ? elapsedMs : 0);
      return {
        kind: 'working', defaultTipo: 'saida', last,
        elapsedMs, workedTodayMs, liveTotalMs, sessionBelongsToday, todayRecords,
      };
    }

    if (last.competencia === today) {
      return {
        kind: 'break', defaultTipo: 'entrada', last,
        elapsedMs: now - new Date(last.horario).getTime(), workedTodayMs, todayRecords,
      };
    }

    const elapsedMs = now - new Date(last.horario).getTime();
    return {
      kind: 'rest', defaultTipo: 'entrada',
      last, elapsedMs, workedTodayMs, todayRecords,
    };
  }

  function liveTodayMs(status) {
    return status.kind === 'working' ? status.liveTotalMs : (status.workedTodayMs || 0);
  }

  function dayTotals(records) {
    const byDay = {};
    for (const r of records) (byDay[r.competencia] ||= []).push(r);
    const totals = {};
    for (const day in byDay) {
      const sorted = byDay[day].sort((a, b) => new Date(a.horario) - new Date(b.horario));
      totals[day] = pairSums(sorted).ms;
    }
    return totals;
  }

  // ── Dados: cache local + planilha ───────────────────────
  function mergedRecords() {
    const byId = new Map();
    for (const r of db.cache.records) byId.set(r.id, r);
    for (const r of db.outbox) byId.set(r.id, r); // otimista: reflete batidas ainda não confirmadas
    return [...byId.values()];
  }

  async function fetchRecords() {
    const res = await fetch(`${db.url}?days=${FETCH_DAYS}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'erro desconhecido');
    return { records: json.records, legacyBalanceMs: json.legacyBalanceMs || 0 };
  }

  // Leitura rápida (últimas ~20 batidas, custo fixo no Apps Script) — usada
  // antes de bater o ponto, só pra saber a última batida e o que já foi
  // feito hoje. Não substitui o cache inteiro, só funde por cima dele.
  async function fetchRecentRecords() {
    const res = await fetch(`${db.url}?mode=recent`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'erro desconhecido');
    return json.records;
  }

  function mergeRecentIntoCache(records) {
    const byId = new Map(db.cache.records.map(r => [r.id, r]));
    for (const r of records) byId.set(r.id, r);
    db.cache = { ...db.cache, records: [...byId.values()] };
  }

  // payload sempre leva um 'action' ('punch' | 'update' | 'delete') — ver apps-script.gs
  async function postAction(payload) {
    const res = await fetch(db.url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS no Apps Script
      body: JSON.stringify(payload),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'erro desconhecido');
    return json;
  }

  async function refreshRecords() {
    if (!db.url) return;
    try {
      const { records, legacyBalanceMs } = await fetchRecords();
      db.cache = { records, legacyBalanceMs, fetchedAt: Date.now() };
      // remove do outbox qualquer batida que já apareceu na planilha
      const ids = new Set(records.map(r => r.id));
      db.outbox = db.outbox.filter(p => !ids.has(p.id));
      save();
      setSyncStatus(`Atualizado às ${fmtTime(new Date())}`, 'ok');
    } catch (e) {
      setSyncStatus('Erro ao atualizar (offline?)', 'err');
    }
    render();
    renderEditor();     // no-op se a aba não estiver ativa
    renderReportBody(); // idem
    renderHeatmap();    // idem
  }

  async function flushOutbox() {
    if (!db.url || !navigator.onLine || db.outbox.length === 0) return;
    for (const payload of [...db.outbox]) {
      try {
        await postAction(payload);
        db.outbox = db.outbox.filter(p => p.id !== payload.id);
        save();
      } catch (_) {
        break; // mantém ordem; tenta o resto depois
      }
    }
    render();
  }

  function genId() {
    return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  }

  // ── Fluxo de registro (2 cliques) ───────────────────────
  async function onPunchClick() {
    if (!db.url) { switchView('settings'); return; }
    if (st.phase !== 'idle') return;

    st.phase = 'loading';
    render();

    try {
      const recent = await fetchRecentRecords();
      mergeRecentIntoCache(recent);
      save();
    } catch (e) {
      // Sem rede: segue com o que já está em cache — o pior caso é sugerir
      // o tipo errado, e os botões de rádio deixam corrigir na hora.
    }

    st.status = computeStatus(mergedRecords());
    st.selectedTipo = st.status.defaultTipo;
    st.phase = 'confirm';
    render();

    refreshRecords(); // sincronização completa em segundo plano (não bloqueia a UI)
  }

  function onCancelClick() {
    st.phase = 'idle';
    st.status = null;
    render();

  function onTipoChange(tipo) {

  async function onConfirmClick() {
    if (st.phase !== 'confirm') return;
    const horario = new Date();
    // Saída fechando uma sessão em aberto (ex.: virada de madrugada) conta
    // para o dia da entrada, não para o dia-calendário em que ela ocorreu.
    const isOvernightCheckout = st.selectedTipo === 'saida' && st.status && st.status.kind === 'working';
    const competencia = isOvernightCheckout ? st.status.last.competencia : localIsoDate(horario);
    const payload = {
      action: 'punch',
      id: genId(),
      tipo: st.selectedTipo,
      horario: horario.toISOString(),
      competencia,
      origem: 'ponto',
    };

    st.phase = 'sending';
    render();

    db.outbox.push(payload);
    save();

    let ok = true;
    try {
      await postAction(payload);
      db.outbox = db.outbox.filter(p => p.id !== payload.id);
      save();
    } catch (e) {
      ok = false;
    }

    st.phase = 'idle';
    st.status = null;
    render();

    const label = payload.tipo === 'entrada' ? 'Entrada' : 'Saída';

      showMsg(`✓ ${label} registrada às ${fmtTime(horario)}`, 'ok');

  // ── Push notifications: mantém o Worker informado do estado atual ──
  function postWorkerState() {
    const status = computeStatus(mergedRecords());
    const isRunning = status.kind === 'working';
    // sessionBelongsToday=false diz ao Worker para não somar a sessão aberta
    // ao total de hoje (turno de madrugada ainda pertence ao dia anterior),
    // mas isRunning continua true para não disparar o lembrete de "não iniciou".
    postState(
      isRunning,
      isRunning ? new Date(status.last.horario).getTime() : null,
      status.workedTodayMs,
      isRunning ? status.sessionBelongsToday : true,
    );
  }

  // ── Render ────────────────────────────────────────────
  function render() {

  function renderPunchCard() {
    const mainEl   = document.getElementById('punchMain');
    const subEl    = document.getElementById('punchSub');
    const btnPunch = document.getElementById('btnPunch');
    const btnCancel= document.getElementById('btnCancel');
    const radioGrp = document.getElementById('radioGroup');
    const refreshInfo = document.getElementById('refreshInfo');

    mainEl.classList.remove('warn');

    if (!db.url) {
      mainEl.textContent = 'Configure o Google Sheets';
      subEl.innerHTML = '<div>Abra Configurações e cole a URL do Apps Script para começar a registrar pontos.</div>';
    } else if (st.phase === 'idle' || st.phase === 'loading' || st.phase === 'sending') {
      const status = computeStatus(mergedRecords());
      paintStatus(status, mainEl, subEl);
    } else if (st.phase === 'confirm' && st.status) {
      paintStatus(st.status, mainEl, subEl);
    }

    // Botões
    if (st.phase === 'idle') {
      btnPunch.textContent = 'Registrar Ponto';
      btnPunch.disabled = false;
      btnPunch.onclick = onPunchClick;
      btnCancel.hidden = true;
      radioGrp.hidden = true;

      btnPunch.textContent = 'Consultando…';
      btnPunch.disabled = true;
      btnCancel.hidden = true;
      radioGrp.hidden = true;
    } else if (st.phase === 'confirm') {
      const label = st.selectedTipo === 'entrada' ? 'Entrada' : 'Saída';
      btnPunch.textContent = `Confirmar ${label}`;
      btnPunch.disabled = false;
      btnPunch.onclick = onConfirmClick;
      btnCancel.hidden = false;
      radioGrp.hidden = false;
      document.getElementById('optEntrada').classList.toggle('selected', st.selectedTipo === 'entrada');
      document.getElementById('optSaida').classList.toggle('selected', st.selectedTipo === 'saida');
      document.querySelector('#optEntrada input').checked = st.selectedTipo === 'entrada';
      document.querySelector('#optSaida input').checked = st.selectedTipo === 'saida';
    } else if (st.phase === 'sending') {
      btnPunch.textContent = 'Enviando…';
      btnPunch.disabled = true;
      btnCancel.hidden = true;
      radioGrp.hidden = true;
    }

    if (db.url) {
      if (db.cache.fetchedAt) {
        refreshInfo.textContent = `atualizado às ${fmtTime(new Date(db.cache.fetchedAt))}`;
      } else {
        refreshInfo.textContent = 'nunca sincronizado';
      }
      if (db.outbox.length > 0) {
        refreshInfo.textContent += ` · ${db.outbox.length} pendente${db.outbox.length > 1 ? 's' : ''}`;
      }
    } else {
      refreshInfo.textContent = '';
    }
  }

  function paintStatus(status, mainEl, subEl) {
    const sub = [];

    if (status.kind === 'empty') {
      mainEl.textContent = 'Nenhum registro ainda';
      sub.push('Bata o primeiro ponto para começar.');
    } else if (status.kind === 'working') {
      const startedAt = new Date(status.last.horario);
      mainEl.textContent = `Trabalhando desde ${fmtTime(startedAt)}`;
      sub.push(`Sessão atual: ${fmtHm(status.elapsedMs)}`);
      if (status.sessionBelongsToday) {
        sub.push(`Total hoje: ${fmtHm(status.liveTotalMs)}`);
        const remaining = db.goal - status.liveTotalMs;
        if (remaining > 0) {
          const eta = new Date(Date.now() + remaining);
          sub.push(`Faltam ${fmtHm(remaining)} p/ meta · previsão de saída: ${fmtTime(eta)}`);
        } else {
          sub.push(`<span class="d-pos">Meta batida! +${fmtHm(-remaining)} de banco</span>`);
        }
      } else {
        sub.push(`Total hoje: 0h 00m`);
        sub.push(`Sessão iniciada ${fmtDate(status.last.competencia).toLowerCase()} — será somada à jornada daquele dia ao bater a saída.`);
      }
    } else if (status.kind === 'break') {
      const startedAt = new Date(status.last.horario);
      const label = status.todayRecords.length === 2 ? 'Almoço' : 'Intervalo';
      mainEl.textContent = `${label} desde ${fmtTime(startedAt)}`;
      sub.push(`Pausa: ${fmtHm(status.elapsedMs)}`);
      sub.push(`Trabalhado até agora: ${fmtHm(status.workedTodayMs)}`);
      const remaining = db.goal - status.workedTodayMs;
      if (remaining > 0) {
        const eta = new Date(Date.now() + remaining);
        sub.push(`Se voltar agora, previsão de saída: ${fmtTime(eta)}`);
      } else {
        sub.push(`<span class="d-pos">Meta já batida hoje (+${fmtHm(-remaining)})</span>`);
      }
    } else if (status.kind === 'rest') {
      const endedAt = new Date(status.last.horario);
      mainEl.textContent = `Última saída: ${fmtDate(status.last.competencia).toLowerCase()} às ${fmtTime(endedAt)}`;
      const restHours = status.elapsedMs / 3600000;
      const cls = restHours >= 11 ? 'd-pos' : 'd-neg';
      sub.push(`Descanso: <span class="${cls}">${fmtHm(status.elapsedMs)}</span>${restHours < 11 ? ' (mínimo legal: 11h)' : ''}`);
    }

    subEl.innerHTML = sub.map(l => `<div>${l}</div>`).join('');
  }

  // Banco de horas, semana e média só consideram dias já fechados (sem 'hoje')
  // — enquanto o dia está em andamento, o total é sempre menor que a meta,
  // e isso fazia esses cards parecerem "devedores" o dia inteiro à toa.
  function updateStats() {
    const t = isoToday();
    const status = computeStatus(mergedRecords());
    const todayMs = liveTodayMs(status);
    const totals = dayTotals(mergedRecords());

    document.getElementById('sToday').textContent = fmtHm(todayMs);
    document.getElementById('sMeta').textContent  = `Meta: ${fmtHm(db.goal)}`;

    const bankEl = document.getElementById('sBank');
    const legacyMs = db.cache.legacyBalanceMs || 0;
    const closedDays = Object.keys(totals).filter(d => d !== t && totals[d] > 0);
    if (closedDays.length === 0 && legacyMs === 0) {
      bankEl.textContent = '—';
      bankEl.className   = 'stat-val';
    } else {
      const bank = legacyMs + closedDays.reduce((sum, d) => sum + (totals[d] - db.goal), 0);
      bankEl.textContent = (bank >= 0 ? '+' : '') + fmtHm(bank);
      bankEl.className   = 'stat-val ' + (bank >= 0 ? 'pos' : 'neg');
    }

    const wDates = weekDates();
    let wMs = 0, wDays = 0;
    wDates.forEach(d => {
      if (d === t) return;
      const ms = totals[d] || 0;
      if (ms > 0) { wMs += ms; wDays++; }
    });
    document.getElementById('sWeek').textContent    = fmtHm(wMs);
    document.getElementById('sWeekSub').textContent = `${wDays} dia${wDays !== 1 ? 's' : ''}`;

    const l7 = last7();
    let l7Ms = 0, l7Days = 0;
    l7.forEach(d => {
      if (d === t) return;
      const ms = totals[d] || 0;
      if (ms > 0) { l7Ms += ms; l7Days++; }
    });
    document.getElementById('sAvg').textContent = fmtHm(l7Days > 0 ? l7Ms / l7Days : 0);
  }

  function renderHistory() {
    const t = isoToday();
    const totals = dayTotals(mergedRecords());
    const days = last7().reverse().filter(d => d !== t && totals[d] > 0);
    const el = document.getElementById('histWrap');

    if (days.length === 0) {
      el.innerHTML = '<div class="hist-empty">Nenhum registro anterior</div>';
      return;
    }

    const rows = days.map(d => {
      const ms    = totals[d];
      const delta = ms - db.goal;
      const cls   = delta >= 0 ? 'd-pos' : 'd-neg';
      const sign  = delta >= 0 ? '+' : '';
      return `<tr>
        <td>${fmtDate(d)}</td>
        <td>${fmtHm(ms)}</td>
        <td class="${cls}">${sign}${fmtHm(delta)}</td>
      </tr>`;
    }).join('');

    el.innerHTML = `<table class="hist-table">
      <thead><tr><th>Dia</th><th>Total</th><th>Desvio</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  // ── Corrigir registros ──────────────────────────────────
  // Edição direta na planilha: corrige horário/tipo de uma batida, apaga uma
  // errada, ou lança uma batida esquecida com horário retroativo. Não passa
  // pelo outbox — se falhar por falta de rede, o usuário tenta de novo.
  function onEditorDateChange() {
    renderEditor();
  }

  function renderEditor() {
    if (!document.getElementById('viewEditor').classList.contains('active')) return;

    const dateStr = document.getElementById('editorDateInput').value || isoToday();
    const records = mergedRecords()
      .filter(r => r.competencia === dateStr)
      .sort((a, b) => new Date(a.horario) - new Date(b.horario));

    const el = document.getElementById('editorList');
    el.innerHTML = records.length === 0
      ? '<div class="hist-empty">Nenhuma batida neste dia</div>'
      : records.map(editorRowHtml).join('');
  }

  function editorRowHtml(r) {
    const t = new Date(r.horario);
    const label = r.tipo === 'entrada' ? 'Entrada' : 'Saída';
    const tag = r.origem && r.origem !== 'ponto' ? `<span class="editor-tag">(${r.origem})</span>` : '';
    return `<div class="editor-row" data-id="${r.id}">
      <span class="editor-row-label">${label}</span>
      <input type="time" class="editor-time" value="${pad(t.getHours())}:${pad(t.getMinutes())}">
      <select class="editor-tipo">
        <option value="entrada" ${r.tipo === 'entrada' ? 'selected' : ''}>Entrada</option>
        <option value="saida" ${r.tipo === 'saida' ? 'selected' : ''}>Saída</option>
      </select>
      <div class="editor-row-actions">
        <button class="icon-btn" title="Salvar" onclick="onEditorSave('${r.id}')">💾</button>
        <button class="icon-btn" title="Excluir" onclick="onEditorDelete('${r.id}')">🗑</button>
      </div>
      ${tag}
    </div>`;
  }

  async function onEditorSave(id) {
    const row = document.querySelector(`.editor-row[data-id="${id}"]`);
    const dateStr = document.getElementById('editorDateInput').value;
    const time = row.querySelector('.editor-time').value;
    const tipo = row.querySelector('.editor-tipo').value;
    if (!time) { showEditorMsg('Preencha o horário', 'err'); return; }

    const horario = combineDateTime(dateStr, time);
    try {
      await postAction({ action: 'update', id, tipo, horario: horario.toISOString(), competencia: dateStr });
      showEditorMsg('Registro atualizado ✓', 'ok');
      await refreshRecords();
    } catch (e) {
      showEditorMsg('Erro ao salvar — tente de novo', 'err');
    }
  }

  async function onEditorDelete(id) {
    if (!confirm('Excluir esta batida da planilha?')) return;
    try {
      await postAction({ action: 'delete', id });
      showEditorMsg('Registro excluído ✓', 'ok');
      await refreshRecords();
    } catch (e) {
      showEditorMsg('Erro ao excluir — tente de novo', 'err');
    }
  }

  async function onEditorAdd() {
    const dateStr = document.getElementById('editorDateInput').value || isoToday();
    const time = document.getElementById('editorNewTime').value;
    const tipo = document.getElementById('editorNewTipo').value;
    if (!time) { showEditorMsg('Preencha o horário', 'err'); return; }

    const horario = combineDateTime(dateStr, time);
    const payload = {
      action: 'punch', id: genId(), tipo,
      horario: horario.toISOString(), competencia: dateStr, origem: 'manual',
    };
    const btn = document.getElementById('btnEditorAdd');
    btn.disabled = true;
    btn.textContent = 'Adicionando…';
    try {
      await postAction(payload);
      showEditorMsg('Batida adicionada ✓', 'ok');
      await refreshRecords();
    } catch (e) {
      showEditorMsg('Erro ao adicionar — tente de novo', 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = '+ Adicionar batida';
    }
  }

  function showEditorMsg(text, cls) {
    const el = document.getElementById('editorMsg');
    el.textContent = text;
    el.className = 'msg ' + cls;
    el.hidden = false;
    setTimeout(() => { el.hidden = true; }, 5000);
  }

  // ── Relatório mensal ──────────────────────────────────
  function onReportMonthChange() {
    st.reportMonth = document.getElementById('reportMonthInput').value;
    document.getElementById('heatmapMonthInput').value = st.reportMonth;
    renderReportBody();
  }

  function monthDates(monthStr) {
    const [y, m] = monthStr.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    return Array.from({ length: daysInMonth }, (_, i) => `${monthStr}-${pad(i + 1)}`);
  }

  // O dia atual nunca entra nas análises — ele está em andamento, então
  // sempre pareceria "abaixo da meta" só por ainda não ter terminado.
  function buildReport(monthStr, allRecordsRaw) {
    const today = isoToday();
    const allRecords = allRecordsRaw.filter(r => r.competencia !== today);
    const inMonth = allRecords.filter(r => r.competencia.startsWith(monthStr));
    const byDay = {};
    for (const r of inMonth) (byDay[r.competencia] ||= []).push(r);

    const totals = {}, firstEntrada = {}, lastSaida = {}, lunchMs = {};
    const incomplete = [];

    for (const day in byDay) {
      const sorted = byDay[day].sort((a, b) => new Date(a.horario) - new Date(b.horario));
      const { ms, open } = pairSums(sorted);
      totals[day] = ms;
      if (open) incomplete.push(day);

      const entradas = sorted.filter(r => r.tipo === 'entrada');
      const saidas   = sorted.filter(r => r.tipo === 'saida');
      if (entradas.length) firstEntrada[day] = new Date(entradas[0].horario);
      if (saidas.length)   lastSaida[day]    = new Date(saidas[saidas.length - 1].horario);

      for (let i = 0; i < sorted.length - 1; i++) {
        if (sorted[i].tipo === 'saida' && sorted[i + 1].tipo === 'entrada') {
          lunchMs[day] = new Date(sorted[i + 1].horario) - new Date(sorted[i].horario);
          break;
        }
      }
    }

    const workedDays = Object.keys(totals).sort();
    const totalMs = workedDays.reduce((sum, d) => sum + totals[d], 0);
    const goalMetDays = workedDays.filter(d => totals[d] >= db.goal).length;

    const avgMinutes = (dates) => {
      const vals = dates.map(d => d.getHours() * 60 + d.getMinutes());
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    };
    const avgEntradaMin = avgMinutes(Object.values(firstEntrada));
    const avgSaidaMin   = avgMinutes(Object.values(lastSaida));

    const lunchVals = Object.values(lunchMs);
    const avgLunchMs = lunchVals.length ? lunchVals.reduce((a, b) => a + b, 0) / lunchVals.length : null;

    // Melhor dia = mais próximo da meta (pra cima ou pra baixo). Pior é dois
    // extremos distintos: o dia com maior déficit e o dia com maior excesso.
    let bestDay = null, worstUnder = null, worstOver = null;
    for (const d of workedDays) {
      const delta = totals[d] - db.goal;
      if (!bestDay || Math.abs(delta) < Math.abs(bestDay.delta)) bestDay = { date: d, delta };
      if (delta < 0 && (!worstUnder || delta < worstUnder.delta)) worstUnder = { date: d, delta };
      if (delta > 0 && (!worstOver  || delta > worstOver.delta))  worstOver  = { date: d, delta };
    }

    // Descanso entre jornadas: compara saída de um dia-com-registro com a
    // entrada do próximo dia-com-registro (histórico completo, não só o mês).
    const allDaysWithRecords = [...new Set(allRecords.map(r => r.competencia))].sort();
    const lowRestDays = [];
    for (let i = 1; i < allDaysWithRecords.length; i++) {
      const prevDay = allDaysWithRecords[i - 1], curDay = allDaysWithRecords[i];
      if (!curDay.startsWith(monthStr)) continue;
      const prevRecords = allRecords.filter(r => r.competencia === prevDay).sort((a, b) => new Date(a.horario) - new Date(b.horario));
      const curRecords  = allRecords.filter(r => r.competencia === curDay).sort((a, b) => new Date(a.horario) - new Date(b.horario));
      const prevLastSaida = [...prevRecords].reverse().find(r => r.tipo === 'saida');
      const curFirstEntrada = curRecords.find(r => r.tipo === 'entrada');
      if (!prevLastSaida || !curFirstEntrada) continue;
      const restMs = new Date(curFirstEntrada.horario) - new Date(prevLastSaida.horario);
      if (restMs < 11 * 3600000) lowRestDays.push(curDay);
    }

    // Banco acumulado: todo o histórico carregado (até FETCH_DAYS dias atrás), não só o mês.
    const allTotals = dayTotals(allRecords);
    const accumBalance = (db.cache.legacyBalanceMs || 0) +
      Object.values(allTotals).filter(ms => ms > 0).reduce((sum, ms) => sum + (ms - db.goal), 0);

    // Saldo médio por dia da semana
    const weekdayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    const weekdayDeltas = Array.from({ length: 7 }, () => []);
    for (const d of workedDays) {
      const [y, mo, dd] = d.split('-').map(Number);
      const dow = new Date(y, mo - 1, dd).getDay();
      weekdayDeltas[dow].push(totals[d] - db.goal);
    }
    const weekdayAvg = weekdayDeltas.map((arr, i) => ({
      name: weekdayNames[i],
      avg: arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null,
    }));

    const dayDeltas = {};
    for (const d of workedDays) dayDeltas[d] = totals[d] - db.goal;

    return {
      workedDays, totalMs, goalMetDays,
      avgEntradaMin, avgSaidaMin, avgLunchMs,
      bestDay, worstUnder, worstOver, incomplete, lowRestDays, accumBalance, weekdayAvg, dayDeltas,
    };
  }

  function fmtMinutesOfDay(min) {
    if (min == null) return '—';
    const h = Math.floor(min / 60), m = Math.round(min % 60);
    return `${pad(h)}:${pad(m)}`;
  }

  function renderReportBody() {
    if (!document.getElementById('viewReport').classList.contains('active')) return;

    const monthStr = document.getElementById('reportMonthInput').value || isoToday().slice(0, 7);
    const r = buildReport(monthStr, mergedRecords());
    const el = document.getElementById('reportBody');

    if (r.workedDays.length === 0) {
      el.innerHTML = '<div class="hist-empty">Nenhum registro neste mês</div>';
      return;
    }

    const monthBalance = r.totalMs - r.workedDays.length * db.goal;
    const fmtDelta = (delta) => `<span class="${delta >= 0 ? 'd-pos' : 'd-neg'}">${delta >= 0 ? '+' : ''}${fmtHm(delta)}</span>`;

    const dayBadge = (lbl, day) => day ? `
      <div class="badge">
        <div class="badge-lbl">${lbl}</div>
        <div class="badge-val">${fmtDate(day.date)} · ${fmtDelta(day.delta)}</div>
      </div>` : '';

    const flagChip = (count, singular, plural, dates) => count > 0
      ? `<span class="flag-chip" title="${dates.map(fmtDate).join(', ')}">⚠ ${count} ${count === 1 ? singular : plural}</span>`
      : '';

    const maxAbsAvg = Math.max(1, ...r.weekdayAvg.map(w => Math.abs(w.avg ?? 0)));
    const weekbars = r.weekdayAvg.map(w => {
      const pct = w.avg == null ? 0 : Math.max(6, Math.abs(w.avg) / maxAbsAvg * 100);
      const isPos = (w.avg ?? 0) >= 0;
      return `
        <div class="weekbar">
          <div class="weekbar-track">
            <div class="weekbar-top">${w.avg != null && isPos ? `<div class="weekbar-bar pos" style="height:${pct}%"></div>` : ''}</div>
            <div class="weekbar-bottom">${w.avg != null && !isPos ? `<div class="weekbar-bar neg" style="height:${pct}%"></div>` : ''}</div>
          </div>
          <div class="weekbar-lbl">${w.name}</div>
        </div>`;
    }).join('');

    el.innerHTML = `
      <div class="stats">
        <div class="stat">
          <div class="stat-lbl">Total do mês</div>
          <div class="stat-val">${fmtHm(r.totalMs)}</div>
          <div class="stat-sub">Meta: ${fmtHm(r.workedDays.length * db.goal)}</div>
        </div>
        <div class="stat">
          <div class="stat-lbl">Saldo do mês</div>
          <div class="stat-val ${monthBalance >= 0 ? 'pos' : 'neg'}">${monthBalance >= 0 ? '+' : ''}${fmtHm(monthBalance)}</div>
          <div class="stat-sub">${r.goalMetDays}/${r.workedDays.length} dias na meta</div>
        </div>
      </div>
      <div class="stats-sm">
        <div class="stat stat-sm">
          <div class="stat-lbl">Entrada média</div>
          <div class="stat-val-sm">${fmtMinutesOfDay(r.avgEntradaMin)}</div>
        </div>
        <div class="stat stat-sm">
          <div class="stat-lbl">Saída média</div>
          <div class="stat-val-sm">${fmtMinutesOfDay(r.avgSaidaMin)}</div>
        </div>
        <div class="stat stat-sm">
          <div class="stat-lbl">Almoço médio</div>
          <div class="stat-val-sm">${r.avgLunchMs != null ? fmtHm(r.avgLunchMs) : '—'}</div>
        </div>
        <div class="stat stat-sm">
          <div class="stat-lbl">Banco acumulado</div>
          <div class="stat-val-sm ${r.accumBalance >= 0 ? 'pos' : 'neg'}">${r.accumBalance >= 0 ? '+' : ''}${fmtHm(r.accumBalance)}</div>
        </div>
      </div>
      <div class="badges">
        ${dayBadge('🏆 Melhor dia', r.bestDay)}
        ${dayBadge('📉 Pior (menos)', r.worstUnder)}
        ${dayBadge('📈 Pior (mais)', r.worstOver)}
      </div>
      ${r.incomplete.length || r.lowRestDays.length ? `
      <div class="flags">
        ${flagChip(r.incomplete.length, 'dia incompleto', 'dias incompletos', r.incomplete)}
        ${flagChip(r.lowRestDays.length, 'descanso curto', 'descansos curtos', r.lowRestDays)}
      </div>` : ''}
      <div class="report-subhd">Saldo médio por dia da semana</div>
      <div class="weekbars">${weekbars}</div>
    `;
  }

  // ── Calendário (heatmap) ────────────────────────────────
  function onHeatmapMonthChange() {
    st.reportMonth = document.getElementById('heatmapMonthInput').value;
    document.getElementById('reportMonthInput').value = st.reportMonth;
    renderHeatmap();
  }

  function renderHeatmap() {
    if (!document.getElementById('viewHeatmap').classList.contains('active')) return;

    const monthStr = document.getElementById('heatmapMonthInput').value || isoToday().slice(0, 7);
    const r = buildReport(monthStr, mergedRecords());
    const el = document.getElementById('heatmapBody');

    if (r.workedDays.length === 0) {
      el.innerHTML = '<div class="hist-empty">Nenhum registro neste mês</div>';
      return;
    }

    const dates = monthDates(monthStr);
    const [y, m] = monthStr.split('-').map(Number);
    const firstDow = new Date(y, m - 1, 1).getDay();
    const incompleteSet = new Set(r.incomplete);

    const cells = [];
    for (let i = 0; i < firstDow; i++) cells.push('<div class="hm-cell hm-empty"></div>');
    for (const d of dates) {
      const delta = r.dayDeltas[d];
      const dayNum = Number(d.slice(-2));
      let cls = 'hm-cell', style = '', title = fmtDate(d);
      if (delta == null) {
        cls += ' hm-empty';
      } else {
        const alpha = Math.min(0.85, 0.18 + Math.abs(delta) / (2 * 3600000) * 0.6);
        const rgb = delta >= 0 ? '5,150,105' : '220,38,38';
        style = ` style="background: rgba(${rgb}, ${alpha});"`;
        if (alpha > 0.5) cls += ' hm-light';
        title += ` · ${delta >= 0 ? '+' : ''}${fmtHm(delta)}`;
      }
      if (incompleteSet.has(d)) { cls += ' hm-incomplete'; title += ' · incompleto'; }
      cells.push(`<div class="${cls}"${style} title="${title}">${dayNum}</div>`);
    }

    const weekdayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    const monthBalance = r.totalMs - r.workedDays.length * db.goal;

    el.innerHTML = `
      <div class="hm-summary">
        <div>Saldo do mês: <b class="${monthBalance >= 0 ? 'd-pos' : 'd-neg'}">${monthBalance >= 0 ? '+' : ''}${fmtHm(monthBalance)}</b></div>
        <div><b>${r.goalMetDays}/${r.workedDays.length}</b> dias na meta</div>
      </div>
      <div class="hm-dow">${weekdayNames.map(n => `<span>${n}</span>`).join('')}</div>
      <div class="hm-grid">${cells.join('')}</div>
      <div class="hm-legend">
        <span><i class="hm-swatch" style="background:rgba(5,150,105,0.6)"></i>Acima da meta</span>
        <span><i class="hm-swatch" style="background:rgba(220,38,38,0.6)"></i>Abaixo da meta</span>
        <span><i class="hm-swatch" style="background:var(--surf2); border:1px solid var(--border);"></i>Sem registro</span>
        <span><i class="hm-swatch" style="background:var(--surf2); border:2px solid var(--warn);"></i>Incompleto</span>
      </div>
    `;
  }

  // ── Navegação (abas) ────────────────────────────────────
  const VIEW_IDS = { home: 'viewHome', report: 'viewReport', heatmap: 'viewHeatmap', editor: 'viewEditor', settings: 'viewSettings' };

  function switchView(name) {
    for (const key in VIEW_IDS) {
      document.getElementById(VIEW_IDS[key]).classList.toggle('active', key === name);
    }
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));

    if (name === 'report') {
      const input = document.getElementById('reportMonthInput');
      if (!input.value) input.value = st.reportMonth || isoToday().slice(0, 7);
      st.reportMonth = input.value;
      renderReportBody();
    } else if (name === 'heatmap') {
      const input = document.getElementById('heatmapMonthInput');
      if (!input.value) input.value = st.reportMonth || isoToday().slice(0, 7);
      st.reportMonth = input.value;
      renderHeatmap();
    } else if (name === 'editor') {
      const input = document.getElementById('editorDateInput');
      if (!input.value) input.value = isoToday();
      renderEditor();
    }
  }

  // ── Settings ──────────────────────────────────────────
  function onGoalChange() {
    const v = parseFloat(document.getElementById('goalInput').value);
    if (v > 0 && v <= 24) {
      db.goal = v * 3600000;
      save();
      render();
      syncPushSettings();
    }
  }

  async function onLegacySave() {
    const statusEl = document.getElementById('legacyStatus');
    if (!db.url) { statusEl.textContent = 'Configure a URL primeiro'; statusEl.className = 'sync-status err'; return; }
    const v = parseFloat(document.getElementById('legacyInput').value);
    if (isNaN(v)) return;

    statusEl.textContent = 'Salvando…';
    statusEl.className = 'sync-status';
    try {
      await postAction({ action: 'setLegacy', horas: v });
      db.cache.legacyBalanceMs = v * 3600000;
      save();
      updateStats();
      renderReportBody();
      statusEl.textContent = 'Saldo legado salvo';
      statusEl.className = 'sync-status ok';
    } catch (e) {
      statusEl.textContent = 'Erro ao salvar (offline?)';
      statusEl.className = 'sync-status err';
    }
  }

  function onUrlChange() {
    db.url = document.getElementById('urlInput').value.trim();
    save();
    setSyncStatus(db.url ? 'URL salva' : 'sem URL configurada', '');
    render();
    if (db.url) refreshRecords();
  }

  function onReminderTimeChange() {
    const v = document.getElementById('reminderTimeInput').value;
    if (/^\d{2}:\d{2}$/.test(v)) {
      db.startReminderTime = v;
      save();
      syncPushSettings();
    }
  }

  // ── Push notifications ─────────────────────────────────
  async function toggleNotifications() {
    if (db.notifyEnabled) {
      db.notifyEnabled = false;
      save();
      render();
      setNotifyStatus('notificações desativadas', '');
      syncPushSettings(); // avisa o Worker para parar de enviar
      return;
    }
    await enableNotifications();
  }

  async function enableNotifications() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      setNotifyStatus('Push não suportado neste navegador', 'err');
      return;
    }
    if (!WORKER_URL || WORKER_URL.includes('PASTE')) {
      setNotifyStatus('Configure WORKER_URL no código primeiro', 'err');
      return;
    }
    setNotifyStatus('Solicitando permissão…', '');
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { setNotifyStatus('Permissão negada', 'err'); return; }

      const reg = await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) {
        sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
        });
      }
      db.notifyEnabled = true;
      save();
      await postRegister(sub);
      setNotifyStatus('Notificações ativadas ✓', 'ok');
      render();
    } catch (e) {
      setNotifyStatus('Erro ao ativar notificações', 'err');
    }
  }

  async function syncPushSettings() {
    if (!WORKER_URL) return;
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (!sub) { db.notifyEnabled = false; save(); render(); return; }
      await postRegister(sub);
    } catch (_) {}
  }

  async function postRegister(subscription) {
    await fetch(WORKER_URL + '/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Token': PUSH_AUTH_TOKEN },
      body: JSON.stringify({
        subscription,
        goalMs:            db.goal,
        startReminderTime: db.startReminderTime,
        timezone:          Intl.DateTimeFormat().resolvedOptions().timeZone,
        notifyEnabled:     db.notifyEnabled,
      }),
    });
  }

  function postState(isRunning, sessionStartMs, todayMs, sessionBelongsToday) {
    if (!WORKER_URL || !db.notifyEnabled) return;
    fetch(WORKER_URL + '/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Token': PUSH_AUTH_TOKEN },
      body: JSON.stringify({ isRunning, sessionStartMs, todayMs, sessionBelongsToday }),
    }).catch(() => {});
  }

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64  = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
  }

  function setNotifyStatus(msg, cls) {
    const el = document.getElementById('notifyStatus');
    el.textContent = msg;
    el.className   = 'sync-status ' + cls;
  }

  function setSyncStatus(msg, cls) {
    const el = document.getElementById('syncStatus');
    el.textContent = msg;
    el.className   = 'sync-status ' + cls;
  }

  // ── Init ──────────────────────────────────────────────
  load();
  render();

  // Recalcula os textos de tempo decorrido periodicamente (sem refazer rede)
  st.tick = setInterval(() => { if (st.phase === 'idle') render(); }, 30000);

  window.addEventListener('online', flushOutbox);
  window.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && st.phase === 'idle') {
      refreshRecords();
      flushOutbox();
    }
  });

  if (db.url) { refreshRecords(); flushOutbox(); }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
  </script>
</body>
</html>
